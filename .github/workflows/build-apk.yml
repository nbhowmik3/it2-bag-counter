name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Add App Icon
        run: python3 -c 'import os; os.makedirs("app/src/main/res/drawable",exist_ok=True); os.makedirs("app/src/main/res/mipmap-anydpi-v26",exist_ok=True); open("app/src/main/res/drawable/ic_bg.xml","w").write("<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#B71C1C\" android:pathData=\"M0,0h108v108h-108z\"/><path android:fillColor=\"#FFB300\" android:pathData=\"M0,88h108v6h-108z\"/></vector>"); open("app/src/main/res/drawable/ic_fg.xml","w").write("<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#FFFFFF\" android:pathData=\"M34,36 L74,36 L80,74 C80,77 77,80 74,80 L34,80 C31,80 28,77 28,74 Z\"/><path android:fillColor=\"#FFB300\" android:pathData=\"M42,28 L66,28 L66,36 L42,36 Z\"/><path android:fillColor=\"#B71C1C\" android:pathData=\"M38,48 L70,48 L70,54 L38,54 Z M38,60 L62,60 L62,66 L38,66 Z\"/></vector>"); xml="<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\"><background android:drawable=\"@drawable/ic_bg\"/><foreground android:drawable=\"@drawable/ic_fg\"/></adaptive-icon>"; open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml","w").write(xml); open("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml","w").write(xml); p="app/src/main/AndroidManifest.xml"; s=open(p).read(); open(p,"w").write(s.replace("<application","<application android:icon=\"@mipmap/ic_launcher\"",1) if "android:icon=" not in s else s)'
      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IT2-Bag-Counter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
